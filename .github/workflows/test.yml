name: Tests

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

permissions:
  contents: read

# Prisma 7 `postinstall` runs `prisma generate`, which requires DATABASE_URL to be set even when
# no database connection is opened (same pattern as `governance-bot.yml`).
env:
  DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@127.0.0.1:5432/ci_placeholder

jobs:
  adr-governance:
    name: ADR Governance Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce ADR governance hygiene
        run: npm run adr:check

      - name: Validate ADR index (implementation/enforcement paths)
        run: npm run adr:index:check

      - name: ADR governance compliance (ACCEPTED vs SUPERSEDED references)
        run: npm run test:adr-governance

      - name: Regenerated docs/adr/index.json matches committed file
        run: node scripts/publish-adr-index.cjs && git diff --exit-code docs/adr/index.json

  epistemic-guardrails:
    name: Epistemic Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: ESLint (custom epistemic rules)
        run: npm run lint
      - name: GraphQL lint (no semantic queries)
        run: node tools/graphql-lint/noSemanticQueries.cjs
      - name: PR diff epistemic scan
        run: node tools/pr-checks/epistemicGuard.cjs
        env:
          GITHUB_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}

      - name: ADR-025 agent role diff guard (frontend app)
        run: node tools/pr-checks/agentRoleGuard.cjs
        env:
          GITHUB_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: ADR-022 schema lint (no derived semantics)
        run: npm run schema:lint
      - name: Check schema snapshot consistency
        run: npm run schema:snapshots:check
      
      - name: Run unit tests with coverage
        run: npm run test:cov --workspace=aletheia-backend
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: aletheia-backend/coverage/lcov.info
          flags: unit
          name: unit-tests
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: aletheia_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aletheia_test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Regenerate backend schema snapshot (must be clean)
        run: |
          npm run schema:generate --workspace=aletheia-backend
          git diff --ignore-cr-at-eol --exit-code aletheia-backend/src/schema.gql
          npm run schema:lint
          npm run schema:snapshots:check
      
      - name: Setup test database
        run: npm run test:e2e:setup
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aletheia_test
      
      # Must match backend e2e (`aletheia-backend/test/jest-e2e.json`), not root `test/jest-e2e.json` — same matrix as MVP Release Gate.
      - name: Run e2e tests
        run: npm run test:e2e:cov --workspace=aletheia-backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aletheia_test

  check-e2e-tests:
    name: Check E2E Test Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolver ↔ dedicated e2e spec reminder (monorepo paths)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          node aletheia-backend/scripts/check-e2e-tests.js --git-range "origin/${BASE_REF}...HEAD"
